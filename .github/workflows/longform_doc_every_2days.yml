name: History Unsealed — Massive Adaptive Documentary (Every 2 Days)

on:
  schedule:
    # Runs every 2 days on EVEN calendar days at 19:00 UTC (2:00 PM US EST) — staggered from Channel 1!
    - cron: '0 19 2-30/2 * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic override (leave blank for next unused US/World history epic)'
        required: false
        default: ''
      chapters:
        description: 'Target chapters (0 = auto-adaptive 12-30 min based on topic depth)'
        required: false
        default: '0'
      dry_run:
        description: 'Dry run only (render without uploading to YouTube)'
        required: false
        default: 'false'
      privacy:
        description: 'YouTube privacy (public, unlisted, private)'
        required: false
        default: 'public'

permissions:
  contents: write

concurrency:
  group: history-unsealed-v15-longform
  cancel-in-progress: false

jobs:
  publish-v15-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system FFmpeg & Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: Produce & Upload Massive Adaptive 16:9 V15 Documentary (12-30 min)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_CHAPTERS: ${{ github.event.inputs.chapters || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          python3 longform_v15.py --topic "${{ github.event.inputs.topic || '' }}" --chapters "${{ github.event.inputs.chapters || '0' }}"

      - name: Save updated long-form state
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "V15 Beast Autopilot"
          git config user.email "autopilot@historyunsealed.local"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "chore(history-unsealed): log published V15 Massive Documentary [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push
          fi
