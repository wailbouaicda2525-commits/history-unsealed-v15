name: Retrofit Existing YouTube Miniatures to V21

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (render without updating YouTube thumbnails)'
        required: false
        default: 'false'
      only_shorts:
        description: 'Update only Shorts videos (9:16-safe)'
        required: false
        default: 'false'
      only_video_id:
        description: 'Optional single YouTube video ID to update'
        required: false
        default: ''

jobs:
  retrofit-v21-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrofit Existing YouTube Thumbnails to V21 Dual-Safe Format
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ONLY_SHORTS: ${{ github.event.inputs.only_shorts || 'false' }}
          ONLY_VIDEO_ID: ${{ github.event.inputs.only_video_id || '' }}
        run: |
          python3 retrofit_thumbnails_v21.py --work-dir /tmp/v21_retrofit
